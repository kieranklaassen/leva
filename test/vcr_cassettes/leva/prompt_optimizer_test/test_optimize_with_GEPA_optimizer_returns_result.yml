        text\n##### expected\n\n\n##### actual\nTest text 3\n\n#### expected_label\n#####
        expected\n\n\n##### actual\npositive\n\n## Example 1\n### Feedback\nScore:
        0.0\n\n\n\n## Example 2\n### Inputs\n#### text\nTest text 7\n\n#### expected_label\nnegative\n\n##
        Example 2\n### Expected\n#### output\nnegative\n\n## Example 2\n### Generated
        Outputs\n#### text\nTest text 7\n\n#### expected_label\nnegative\n\n#### output\nnegative\n\n##
        Example 2\n### Diff\n#### text\n##### expected\n\n\n##### actual\nTest text
        7\n\n#### expected_label\n##### expected\n\n\n##### actual\nnegative\n\n##
        Example 2\n### Feedback\nScore: 0.0\n\n\n```\n\nYour task is to write a new
        instruction for the assistant.\n\nRead the inputs carefully and identify the
        input format and infer detailed task description about the task I wish to
        solve with the assistant.\n\nRead all the assistant responses and the corresponding
        feedback. Identify all niche and domain specific factual information about
        the task and include it in the instruction, as a lot of it may not be available
        to the assistant in the future. The assistant may have utilized a generalizable
        strategy to solve the task, if so, include that in the instruction as well.\n\nProvide
